plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.droplink.app'
    compileSdk 34

    signingConfigs {
        release {
            // 签名信息通过环境变量注入，仓库里不放密钥与口令
            def ks = System.getenv("DROPLINK_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("DROPLINK_STORE_PASSWORD")
                keyAlias System.getenv("DROPLINK_KEY_ALIAS") ?: "droplink"
                keyPassword System.getenv("DROPLINK_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.droplink.app"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.1.2"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.zxing:core:3.5.3'

    // 扫码相机
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // SAF 目录选择
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

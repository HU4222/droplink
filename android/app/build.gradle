plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.droplink.app'
    compileSdk 34

    // Release signing is read from environment variables so no keystore or
    // password ever lives in the repository. Without them the release build
    // falls back to the debug key, which is fine for local testing but must
    // NOT be used for store distribution.
    signingConfigs {
        release {
            def ks = System.getenv("DROPLINK_KEYSTORE")
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("DROPLINK_STORE_PASSWORD") ?: ""
                keyAlias System.getenv("DROPLINK_KEY_ALIAS") ?: "droplink"
                keyPassword System.getenv("DROPLINK_KEY_PASSWORD") ?: ""
            }
        }
    }

    defaultConfig {
        applicationId "com.droplink.app"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 没有配置密钥时退回 debug 签名，保证 clone 后能直接 assembleRelease
            signingConfig System.getenv("DROPLINK_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // kotlinx-coroutines 的调试探针会被打进 release 包，属于可剔除的调试产物
    packaging {
        resources {
            excludes += ['DebugProbesKt.bin', 'META-INF/versions/9/OSGiManifest.mf']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.zxing:core:3.5.3'

    // 扫码相机
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // SAF 目录选择
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

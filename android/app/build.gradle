plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.droplink.app'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('../droplink.keystore')
            storePassword 'droplink123'
            keyAlias 'droplink'
            keyPassword 'droplink123'
        }
    }

    defaultConfig {
        applicationId "com.droplink.app"
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "1.4.7"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // kotlinx-coroutines 的调试探针会被打进 release 包，属于可剔除的调试产物
    packaging {
        resources {
            excludes += ['DebugProbesKt.bin', 'META-INF/versions/9/OSGiManifest.mf']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.zxing:core:3.5.3'

    // 扫码相机
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // SAF 目录选择
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
